name: Build Executables (Windows & Mac)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # อนุญาตให้กดสั่งรันเองแบบ manual บนเว็บ GitHub ได้

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: DataMiningApp-Windows
            binary_path: dist/DataMiningApp.exe
          - os: macos-latest
            artifact_name: DataMiningApp-macOS
            binary_path: dist/DataMiningApp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --onefile --console --hidden-import=init_data --hidden-import=preparation --hidden-import=association_rule --hidden-import=cluster_analysis --hidden-import=dimensionality_reduction --name "DataMiningApp" main.py

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
          retention-days: 7
